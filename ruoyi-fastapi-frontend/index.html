<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="renderer" content="webkit">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="description" content="同见管理中心：组织、账号与权限管理。">
  <meta name="theme-color" content="#243247">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=tongjian-1">
  <title>%VITE_APP_TITLE%</title>
  <!--[if lt IE 11]><script>window.location.href='/html/ie.html';</script><![endif]-->
  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    /* 应用挂载前直接显示，避免依赖尚未加载的组件和样式。 */
    .startup-screen {
      box-sizing: border-box;
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 32px 24px;
      background: radial-gradient(ellipse at 50% 40%, #192e4b 0%, #070f22 65%);
      color: #f0f5ff;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      text-align: center;
    }

    .startup-brand {
      display: block;
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgb(0 0 0 / 20%);
    }

    .startup-title {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
      line-height: 1.5;
      letter-spacing: 2px;
    }

    .startup-description {
      margin: 10px 0 32px;
      color: #b0bfd4;
      font-size: 13px;
      line-height: 1.8;
      letter-spacing: 1px;
    }

    .startup-track {
      width: 180px;
      height: 3px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 3px;
      background: #263a55;
    }

    .startup-track::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #69a5ff, #94dff0);
      animation: startup-loading 1.6s ease-in-out infinite alternate;
    }

    .startup-status {
      margin: 18px 0 0;
      color: #b0bfd4;
      font-size: 12px;
      line-height: 1.8;
    }

    @keyframes startup-loading {
      from { transform: translateX(0); }
      to { transform: translateX(150%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .startup-track::after {
        animation: none;
        margin-inline: auto;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="startup-screen" role="status" aria-live="polite" aria-busy="true">
      <div>
        <img class="startup-brand" src="/brand-mark.svg" alt="" width="64" height="64">
        <h1 class="startup-title">同见 · 管理中心</h1>
        <p class="startup-description">组织、账号与权限管理</p>
        <div class="startup-track" aria-hidden="true"></div>
        <p class="startup-status">正在加载管理中心，请稍候…</p>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
